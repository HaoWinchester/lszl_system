# Production settings for the shared assistant topology. Include after
# docker-compose.teacher-assistant.yml; volumes remain Compose-project scoped.
services:
  assistant-worker:
    build:
      args:
        BACKEND_RUNTIME: lszl-kg-backend:latest
    image: lszl-teacher-assistant:prod
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kg}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kg_graph}
  document-converter:
    image: lszl-teacher-assistant:prod
