  <header class="admin-topbar">
    <a class="admin-brand" href="admin-console.html"><span>P</span><div><strong>项目管理学习者</strong><small>财务管理</small></div></a>
    <div class="admin-account admin-account-menu" id="adminAccountMenu">
      <button type="button" class="admin-account-trigger" id="adminAccountTrigger" aria-haspopup="menu" aria-expanded="false"><span class="admin-account-dot" aria-hidden="true"></span><span id="adminAccount">读取账号中</span><b aria-hidden="true">⌄</b></button>
      <div class="admin-account-popover" id="adminAccountPopover" role="menu" hidden>
        <button type="button" role="menuitem" id="adminAccountUserCenterBtn"><span class="admin-account-icon" aria-hidden="true">♙</span><span>用户中心</span></button>
        <button type="button" role="menuitem" id="adminAccountHelpBtn"><span class="admin-account-icon" aria-hidden="true">?</span><span>帮助中心</span></button>
        <div class="admin-account-divider" aria-hidden="true"></div>
        <button type="button" role="menuitem" class="danger" id="adminAccountLogoutBtn"><span class="admin-account-icon" aria-hidden="true">↪</span><span>退出登录</span></button>
      </div>
    </div>
  </header>
  <div class="admin-app-shell">
    <main class="admin-main finance-page">
      <section class="admin-page-head">
        <div><p>COMPANY FINANCE</p><h1>财务管理</h1><span>登记公司日常消费（金额、用途、发票），按月查看汇总。管理员与教师可录入，删除仅限管理员。</span></div>
        <div class="admin-head-actions"><button id="financeRefreshBtn" type="button" class="finance-btn finance-btn-ghost" title="重新读取记录"><span data-admin-icon="refresh-cw" data-admin-icon-size="15" aria-hidden="true"></span><span>刷新</span></button></div>
      </section>

      <div class="finance-shell">
        <aside class="finance-card finance-form-card" id="financeFormPanel">
          <header class="finance-card-head"><div><p id="financeFormMode">NEW RECORD</p><h2 id="financeFormTitle">登记消费</h2></div></header>
          <form id="financeRecordForm">
            <label class="finance-field">
              <span class="finance-field-label">金额<i>*</i></span>
              <span class="finance-money-input"><b>¥</b><input id="financeAmount" name="amount" type="number" step="0.01" min="0.01" required placeholder="0.00" inputmode="decimal"/></span>
            </label>
            <div class="finance-field">
              <span class="finance-field-label">消费日期<i>*</i></span>
              <div class="finance-date-seg" id="financeDateSeg" role="group" aria-label="消费日期"></div>
            </div>
            <label class="finance-field">
              <span class="finance-field-label">用途<i>*</i></span>
              <input class="finance-text-input" id="financePurpose" name="purpose" type="text" maxlength="200" required placeholder="例如：办公耗材采购"/>
            </label>
            <label class="finance-field">
              <span class="finance-field-label">备注</span>
              <textarea class="finance-text-input" id="financeNote" name="note" rows="2" maxlength="2000" placeholder="选填"></textarea>
            </label>
            <div class="finance-field">
              <span class="finance-field-label">发票附件<small>png / jpg / webp / pdf，限 20 MiB</small></span>
              <div class="finance-drop" id="financeDrop" tabindex="0" role="button" aria-label="选择或拖入发票文件">
                <input id="financeInvoice" name="invoice" type="file" accept=".png,.jpg,.jpeg,.webp,.pdf" hidden/>
                <svg class="finance-drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16.2A4.2 4.2 0 0 1 6.2 8.5a5.4 5.4 0 0 1 10.5-1.2A4.6 4.6 0 0 1 20 16.1"/><path d="M12 12v8"/><path d="m8.5 15.5 3.5-3.5 3.5 3.5"/></svg>
                <span class="finance-drop-text">点击选择或拖入文件</span>
                <span class="finance-drop-sub">支持图片与 PDF，自动校验格式</span>
              </div>
              <div class="finance-file-chip" id="financeFileChip" hidden>
                <svg class="finance-file-chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
                <span class="finance-file-chip-name" id="financeFileChipName"></span>
                <span class="finance-file-chip-size" id="financeFileChipSize"></span>
                <button type="button" class="finance-file-chip-remove" id="financeFileChipRemove" aria-label="移除已选发票">×</button>
              </div>
            </div>
            <div class="finance-form-actions">
              <button type="button" class="finance-btn finance-btn-ghost" id="financeCancelEditBtn" hidden>取消编辑</button>
              <button type="submit" class="finance-btn finance-btn-primary" id="financeSubmitBtn">保存记录</button>
            </div>
          </form>
        </aside>

        <section class="finance-main">
          <div class="finance-toolbar">
            <div class="finance-month-picker" role="group" aria-label="按月切换">
              <button type="button" class="finance-month-nav" id="financeMonthPrev" aria-label="上一月" title="上一月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
              <button type="button" class="finance-month-current" id="financeMonthCurrent" title="点击回到本月">—</button>
              <button type="button" class="finance-month-nav" id="financeMonthNext" aria-label="下一月" title="下一月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
              <button type="button" class="finance-month-all" id="financeMonthAll" title="查看全部记录">全部</button>
            </div>
            <div class="finance-kpi">
              <article class="finance-kpi-primary"><span>所选范围合计</span><strong id="financeMonthTotal">—</strong></article>
              <article><span>笔数</span><strong id="financeMonthCount">—</strong></article>
              <article><span>全部合计</span><strong id="financeAllTotal">—</strong><small id="financeAllDetail"></small></article>
            </div>
          </div>
          <div class="finance-card finance-table-card">
            <table class="finance-table">
              <thead><tr><th>日期</th><th>用途</th><th class="finance-col-amount">金额</th><th>备注</th><th>发票</th><th>录入人</th><th>操作</th></tr></thead>
              <tbody id="financeRows"><tr><td colspan="7" class="finance-empty">正在读取…</td></tr></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <div class="finance-viewer" id="financeViewer" role="dialog" aria-modal="true" aria-label="发票预览" hidden>
    <div class="finance-viewer-card">
      <div class="finance-viewer-head"><strong id="financeViewerName">发票</strong><small id="financeViewerMeta"></small><button type="button" class="finance-btn finance-btn-ghost finance-viewer-download" id="financeViewerDownload">下载</button><button type="button" class="finance-viewer-close" id="financeViewerClose" aria-label="关闭预览">×</button></div>
      <div class="finance-viewer-body" id="financeViewerBody"></div>
    </div>
  </div>
  <div id="adminToast" class="admin-toast" role="status" aria-live="polite"></div>
