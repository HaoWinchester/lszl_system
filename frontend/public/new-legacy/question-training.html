<body>
  <main aria-labelledby="practiceRedirectTitle">
    <h1 id="practiceRedirectTitle">正在转到刷题…</h1>
    <p>单题深学已停用，正在为你切换到刷题。</p>
    <p><a id="practiceRedirectFallback" href="practice-mode.html">如果没有自动跳转，请前往刷题</a></p>
  </main>
  <script>
    (function redirectRetiredSingleDeep() {
      const allowed = ['paperId', 'releaseId', 'questionId', 'bankId', 'courseId', 'taskId', 'subject', 'returnTo'];
      const source = new URL(location.href);
      const params = new URLSearchParams();
      const target = new URL('practice-mode.html', location.origin + '/');

      for (const key of allowed) {
        if (!source.searchParams.has(key)) continue;
        const value = source.searchParams.get(key);
        if (key === 'returnTo') {
          try {
            const candidate = new URL(value, location.origin);
            if (candidate.origin === location.origin && candidate.pathname.startsWith('/')) params.set(key, candidate.pathname);
          } catch (error) {}
        } else {
          params.set(key, value);
        }
      }

      params.set('retiredMode', 'single_deep_study');
      target.search = params.toString();
      const fallback = document.getElementById('practiceRedirectFallback');
      if (fallback) fallback.href = target.toString();
      location.replace(target.toString());
    })();
  </script>
</body>
