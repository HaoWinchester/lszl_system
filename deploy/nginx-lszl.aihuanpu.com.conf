# lszl.aihuanpu.com —— 佩奇老师（FastAPI 后端一站式 serve 前端页面 + /api/v1）
# 部署：sudo cp 此文件 /etc/nginx/conf.d/lszl.aihuanpu.com.conf && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name lszl.aihuanpu.com;

    # Let's Encrypt 证书验证（保留续期用）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余强制跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name lszl.aihuanpu.com;

    ssl_certificate /etc/letsencrypt/live/lszl.aihuanpu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lszl.aihuanpu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 学习包 ZIP 导入 / 文件上传预留
    client_max_body_size 50m;

    # 全量反代到后端容器（页面 + 静态资源 + /api/v1 都由后端处理）
    location / {
        proxy_pass http://127.0.0.1:18086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
