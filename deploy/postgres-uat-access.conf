# Keep these rules BEFORE general allow rules in the shared instance pg_hba.conf.
# kg_uat must also be NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS.
local kg_graph_uat kg_uat scram-sha-256
local all kg_uat reject
host kg_graph_uat kg_uat all scram-sha-256
host all kg_uat all reject
