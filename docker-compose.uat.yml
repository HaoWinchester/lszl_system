# UAT uses a separate database/account in the existing production PostgreSQL instance.
# Provision kg_graph_uat and its restricted kg_uat role before starting this service.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: lszl-kg-backend:uat-27c39ab
    restart: unless-stopped
    environment:
      ENV: uat
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://kg_uat:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-lszl-kg-db-1}:5432/kg_graph_uat
      CORS_ORIGINS: '["http://uat.aihuanpu.com"]'
      QUESTION_CATALOG_CUTOVER_ENABLED: "true"
      GRAPH_FILES_API_CUTOVER_ENABLED: ${GRAPH_FILES_API_CUTOVER_ENABLED:-false}
      CONTENT_PREP_VALIDATION_DISABLED: "false"
      WECHAT_APP_ID: ""
      WECHAT_APP_SECRET: ""
      WECHAT_REDIRECT_URI: ""
      WECHAT_ENABLE_OFFICIAL: "false"
      WECHAT_ENABLE_DEMO: "false"
      WECHAT_PAY_ENABLE_DEMO: "false"
      WECHAT_PAY_MCH_ID: ""
      WECHAT_PAY_API_V3_KEY: ""
      WECHAT_PAY_MCH_SERIAL_NO: ""
      WECHAT_PAY_MCH_PRIVATE_KEY_FILE: ""
      WECHAT_PAY_WX_PUBLIC_KEY_FILE: ""
      WECHAT_PAY_WX_PUBLIC_KEY_ID: ""
      WECHAT_PAY_APP_ID: ""
      WECHAT_PAY_NOTIFY_URL: ""
    ports:
      - "127.0.0.1:18087:8000"

networks:
  default:
    external: true
    name: ${POSTGRES_NETWORK:-lszl-kg_default}
