<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="color-scheme" content="light"/>
  <title>做题模式｜项目管理学习营</title>
  <link rel="stylesheet" href="styles/main.css"/>
  <link rel="stylesheet" href="styles/user-center.css"/>
  <link rel="stylesheet" href="styles/account-menu.css"/>
  <link rel="stylesheet" href="styles/support-center.css"/>
  <link rel="stylesheet" href="styles/practice-mode.css"/>
  <link rel="stylesheet" href="styles/focus-vega-typography.css"/>
  <link rel="stylesheet" href="styles/learning-skin.css"/>
</head>
<body class="practice-mode-page" data-learning-skin="focus-vega">
  <div class="practice-app">
    <header class="practice-header">
      <a class="practice-brand" href="practice-mode.html" aria-label="返回做题模式大厅">
        <span class="practice-brand-mark" aria-hidden="true">P</span>
        <span><strong>做题模式</strong><small>轻量练习</small></span>
      </a>
      <div class="practice-header-actions">
        <nav class="practice-mode-switch" aria-label="模式切换" title="切换做题或自由模式">
          <a class="is-active" href="practice-mode.html" aria-current="page">做题</a>
          <a href="index.html">自由</a>
        </nav>
        <div class="account-menu-shell" id="accountMenuShell" data-account-help-href="multi-question-help.html">
        <button aria-controls="accountMenu" aria-expanded="false" aria-haspopup="menu" class="auth-status account-menu-trigger" data-account-menu-trigger="true" id="authStatus" title="打开账号菜单" type="button">
          <span class="account-menu-status-dot" aria-hidden="true"></span><span class="account-menu-trigger-label">访客</span>
          <span class="account-menu-chevron" data-kg-icon="chevron-down" data-kg-icon-size="16" aria-hidden="true"></span>
        </button>
        <div class="account-menu" hidden id="accountMenu" role="menu" aria-label="账号菜单">
          <button class="account-menu-item" id="accountMenuUserCenterBtn" role="menuitem" type="button"><span data-kg-icon="circle-user-round" data-kg-icon-size="16" aria-hidden="true"></span><span class="account-menu-item-label">用户中心</span></button>
          <button class="account-menu-item" id="accountMenuHelpBtn" role="menuitem" type="button"><span data-kg-icon="circle-help" data-kg-icon-size="16" aria-hidden="true"></span><span class="account-menu-item-label">帮助中心</span></button>
          <div class="account-menu-separator" role="separator"></div>
          <button class="account-menu-item account-menu-session" id="accountMenuSessionBtn" role="menuitem" type="button"><span data-account-session-icon data-kg-icon="log-in" data-kg-icon-size="16" aria-hidden="true"></span><span class="account-menu-item-label">登录</span></button>
        </div>
      </div>
      </div>
      <button class="account-hidden-trigger" hidden id="authLoginBtn" type="button">登录</button>
      <button class="account-hidden-trigger" hidden id="authLogoutBtn" type="button">退出登录</button>
    </header>

    <main class="practice-main">
      <section class="practice-lobby" id="practiceLobby" aria-labelledby="practiceLobbyTitle">
        <header class="practice-lobby-head">
          <span>READY</span>
          <h1 id="practiceLobbyTitle">选择一套试卷，开始练习</h1>
        </header>

        <section class="practice-setup-card" aria-label="练习设置">
          <label class="practice-field">
            <span>选择试卷</span>
            <select id="practicePaperSelect" aria-describedby="practicePaperMeta"></select>
            <small id="practicePaperMeta">正在读取已发布试卷…</small>
          </label>

          <fieldset class="practice-choice-group">
            <legend>题目数量</legend>
            <div class="practice-count-options" id="practiceCountOptions">
              <label><input type="radio" name="practiceCount" value="10" checked/><span>10</span></label>
              <label><input type="radio" name="practiceCount" value="20"/><span>20</span></label>
              <label><input type="radio" name="practiceCount" value="60"/><span>60</span></label>
              <label><input type="radio" name="practiceCount" value="180"/><span>180</span></label>
            </div>
          </fieldset>

          <fieldset class="practice-choice-group">
            <legend>答题顺序</legend>
            <div class="practice-order-options">
              <label><input type="radio" name="practiceOrder" value="paper" checked/><span>试卷顺序</span></label>
              <label><input type="radio" name="practiceOrder" value="random"/><span>随机顺序</span></label>
            </div>
          </fieldset>
        </section>

        <section class="practice-mode-grid" aria-label="选择练习模式">
          <article class="practice-mode-card challenge">
            <span class="practice-mode-icon" data-kg-icon="diamond" data-kg-icon-size="20" aria-hidden="true"></span>
            <div><small>CHALLENGE</small><h2>挑战模式</h2><p>用三点血量持续闯关。连续答对可获得额外经验，并恢复血量。</p></div>
            <button type="button" class="practice-start-btn" data-practice-start="challenge">开始挑战</button>
          </article>
          <article class="practice-mode-card scholar">
            <span class="practice-mode-icon" data-kg-icon="zap" data-kg-icon-size="20" aria-hidden="true"></span>
            <div><small>SCHOLAR</small><h2>学霸模式</h2><p>共享 80 秒倒计时。答对加时间，答错扣时间并损失血量。</p></div>
            <button type="button" class="practice-start-btn" data-practice-start="scholar">进入学霸模式</button>
          </article>
        </section>

        <section class="practice-history" id="practiceHistorySection" aria-labelledby="practiceHistoryTitle" hidden>
          <div class="practice-section-head"><h2 id="practiceHistoryTitle">最近练习</h2><button type="button" id="practiceClearHistoryBtn">清空记录</button></div>
          <div id="practiceHistoryList" class="practice-history-list"></div>
        </section>

        <div class="practice-empty" id="practiceEmpty" hidden>
          <strong>暂时没有可练习的已发布试卷</strong>
          <p>请先让教师在“教师工作台 → 试卷管理”中完成选题并发布。</p>
        </div>
      </section>

      <section class="practice-game" id="practiceGame" hidden aria-live="polite">
        <header class="practice-game-topbar">
          <button type="button" class="practice-exit-btn" id="practiceExitBtn" aria-label="退出本次练习" title="退出"><span data-kg-icon="x" data-kg-icon-size="18" aria-hidden="true"></span></button>
          <div class="practice-progress-shell" id="practiceProgressShell" role="progressbar" aria-label="做题进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="practiceProgressBar"></span></div>
          <div class="practice-health" id="practiceHealth" aria-label="剩余血量"></div>
          <div class="practice-scholar-stat practice-timer" id="practiceTimer" hidden><strong>80</strong><span>秒</span></div>
        </header>
        <div class="practice-time-row" id="practiceTimeRow" hidden aria-hidden="true">
          <span class="practice-time-icon" data-kg-icon="timer" data-kg-icon-size="18" aria-hidden="true"></span>
          <div class="practice-time-rail" id="practiceTimeRail"><span id="practiceTimeBar"></span></div>
        </div>
        <div class="practice-streak-pop" id="practiceStreakPop" hidden role="status"></div>
        <div class="practice-feedback" id="practiceFeedback" hidden role="status"></div>

        <article class="practice-question-card" id="practiceQuestionCard">
          <div class="practice-question-stem" id="practiceQuestionStem"></div>
          <div class="practice-options" id="practiceOptions"></div>
        </article>
      </section>

      <section class="practice-checkpoint" id="practiceCheckpoint" hidden aria-labelledby="practiceCheckpointTitle">
        <span>CHECKPOINT</span>
        <h1 id="practiceCheckpointTitle">继续保持</h1>
        <div class="practice-checkpoint-stats">
          <div><span>连胜</span><strong id="practiceCheckpointStreak">0</strong></div>
          <div><span>经验值</span><strong id="practiceCheckpointExperience">0</strong></div>
          <div><span>耗时</span><strong id="practiceCheckpointDuration">00:00</strong></div>
        </div>
        <button type="button" class="practice-primary-btn" id="practiceCheckpointContinue">继续</button>
      </section>

      <section class="practice-result" id="practiceResult" hidden aria-labelledby="practiceResultTitle">
        <span>COMPLETE</span>
        <h1 id="practiceResultTitle">练习结束</h1>
        <div class="practice-result-stats">
          <div><span>正确率</span><strong id="practiceResultAccuracy">0%</strong></div>
          <div><span>总耗时</span><strong id="practiceResultDuration">00:00</strong></div>
          <div><span>经验值</span><strong id="practiceResultExperience">0</strong></div>
        </div>
        <div class="practice-result-actions">
          <button type="button" class="practice-primary-btn" id="practiceAgainBtn">再练一次</button>
          <button type="button" class="practice-secondary-btn" id="practiceLobbyBtn">返回大厅</button>
        </div>
      </section>
    </main>
  </div>

  <div class="practice-danger-vignette" id="practiceDangerVignette" aria-hidden="true"></div>

  <div class="practice-exit-backdrop" id="practiceExitConfirm" hidden aria-hidden="true">
    <section class="practice-exit-dialog" role="dialog" aria-modal="true" aria-labelledby="practiceExitTitle">
      <h2 id="practiceExitTitle">退出本次练习？</h2>
      <p>退出后本次练习立即结束，当前进度不能继续。</p>
      <div><button type="button" class="practice-secondary-btn" id="practiceExitCancel">继续做题</button><button type="button" class="practice-danger-btn" id="practiceExitConfirmBtn">退出练习</button></div>
    </section>
  </div>

  <div id="authDialogRoot"></div>

  <script defer src="src/01-runtime-config.js"></script>
  <script defer src="src/28-app-storage.js"></script>
  <script defer src="src/29-auth-core.js"></script>
  <script defer src="src/30-shared-auth-dialog.js"></script>
  <script defer src="src/32-wechat-login.js"></script>
  <script defer src="src/34-role-permissions.js"></script>
  <script defer src="src/37-subscription-plans.js"></script>
  <script defer src="src/37-subscription-orders.js"></script>
  <script defer src="src/37-subscription-redeem-codes.js"></script>
  <script defer src="src/37-subscription-core.js"></script>
  <script defer src="src/33-user-center.js"></script>
  <script defer src="src/107-learning-ui-icons.js"></script>
  <script defer src="src/41-account-menu.js"></script>
  <script defer src="src/101-engagement-repository.js"></script>
  <script defer src="src/103-support-center.js"></script>
  <script defer src="src/100-practice-mode.js"></script>
</body>
</html>
