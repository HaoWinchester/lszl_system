# UAT mini-program integration only. Layer on docker-compose.uat.yml.
# PC login/payment settings, ports and database remain in the base file.
services:
  backend:
    env_file:
      - ./backend/.env.wechat-mini.local
    environment:
      WECHAT_MINI_ENABLE_DEMO: "false"
    # Keep the base image and startup migration; never log WeChat query secrets.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head && exec python -c
        "import logging, uvicorn;
        logging.getLogger('httpx').setLevel(logging.WARNING);
        logging.getLogger('httpcore').setLevel(logging.WARNING);
        uvicorn.run('app.main:app', host='0.0.0.0', port=8000)"
